    <meta charset="UTF-8">

        // Session Guard
        if (localStorage.getItem('admin_session') !== 'true') {
            window.location.href = 'index.html';
        }

<body class="bg-gray-50 text-gray-900">

                    Dashboard
                </a>
                <a href="pos.html" class="flex items-center gap-3 p-3 bg-white/10 rounded-xl font-medium">
                    Ventas (POS)
                </a>
                <a href="cobro.html" class="flex items-center gap-3 p-3 hover:bg-white/5 rounded-xl transition-all">

                </a>
                <a href="viewer.html" class="flex items-center gap-3 p-3 hover:bg-white/5 rounded-xl transition-all">
                    Visor de Pedidos
                </a>
                <a href="inventory.html" class="flex items-center gap-3 p-3 hover:bg-white/5 rounded-xl transition-all">

                </a>
                <div class="pt-10 space-y-4 border-t border-white/10">

                        Ver Menú Público
                    </a>
                    <button onclick="logout()"

                        Cerrar Sesión
                    </button>
                </div>
            </nav>
        </aside>

        <!-- POS Area -->
        <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- Left: Product Selection -->
            <div class="flex-1 flex flex-col p-6 overflow-hidden">
                <header class="flex justify-between items-center mb-6">

                        <button onclick="toggleSidebar()"

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                        <h1 class="text-2xl font-bold font-display">Crear Nuevo Pedido</h1>
                    </div>
                    <div class="relative w-64">
                        <input type="text" id="search-box" placeholder="Buscar producto..."
                            class="w-full border rounded-xl p-2 pl-4 focus:ring-2 ring-primary outline-none text-sm">
                    </div>
                </header>

                <!-- Product Grid -->
                <div id="pos-grid"
                    class="flex-1 grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Products -->
                </div>
            </div>

            <!-- Right: Cart & Summary -->
            <aside class="w-full md:w-96 bg-white border-l shadow-2xl flex flex-col">
                <div class="p-6 border-b">
                    <h2 class="text-xl font-bold mb-4">Detalle del Pedido</h2>
                    <input type="text" id="client-name" placeholder="Nombre del Cliente"
                        class="w-full border rounded-xl p-3 mb-3 focus:ring-2 ring-primary outline-none">
                    <textarea id="order-comment" placeholder="Notas/Comentarios (Opcional)" rows="2"
                        class="w-full border rounded-xl p-3 focus:ring-2 ring-primary outline-none text-sm resize-none"></textarea>
                </div>

                <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
                    <!-- Cart entries -->
                    <div class="text-center text-gray-400 py-20">Carrito vacío</div>
                </div>

                <div class="p-6 border-t space-y-4 bg-gray-50">
                    <div class="flex justify-between text-lg font-bold">
                        <span>Total:</span>
                        <span id="cart-total">LPS 0.00</span>
                    </div>
                    <button id="btn-checkout"
                        class="w-full bg-primary text-white p-4 rounded-2xl font-bold shadow-lg hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                        COLOCAR PEDIDO
                    </button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Custom Alert Modal -->
    <div id="alert-modal"
        class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center animate__animated animate__zoomIn">
            <div class="mb-6">
                <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl text-primary">ℹ️</span>
                </div>
                <h2 class="text-xl font-black mt-2">Aviso</h2>
                <p id="alert-message" class="text-gray-500 text-sm mt-3 leading-relaxed"></p>
                <div id="qrcode-container" class="mt-4 flex justify-center hidden">
                    <div id="qrcode" class="p-2 bg-white rounded-xl shadow-inner border"></div>
                </div>
            </div>
            <button onclick="closeAppAlert()"
                class="w-full py-4 rounded-2xl font-bold bg-primary text-white hover:bg-red-600 transition-all shadow-lg active:scale-95">ENTENDIDO</button>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, addDoc, serverTimestamp, runTransaction, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let products = [];
        let cart = [];
        const grid = document.getElementById('pos-grid');
        const cartList = document.getElementById('cart-items');
        const totalEl = document.getElementById('cart-total');
        const btnCheckout = document.getElementById('btn-checkout');
        const clientInput = document.getElementById('client-name');
        const searchInput = document.getElementById('search-box');

        // Load Products
        onSnapshot(collection(db, "productos"), (snap) => {
            products = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
        });

        searchInput.onkeyup = (e) => {
            if (e.key === 'Enter') {
                const val = searchInput.value.trim().toUpperCase();
                // If it looks like an order ID (8 chars)
                if (val.length === 8) {
                    showAppAlert('Buscando pedido por código: ' + val);
                    // Here we could open a modal for that order
                }
            }
            renderGrid();
        };

        function getCalculatedStock(product) {
            if (!product.receta || product.receta.length === 0) return product.cantidad;
            let max = Infinity;
            for (const ing of product.receta) {
                const ingredientProduct = products.find(p => p.id === ing.id);
                if (!ingredientProduct) return 0;
                const available = Math.floor(ingredientProduct.cantidad / ing.qty);
                if (available < max) max = available;
            }
            return max === Infinity ? 0 : max;
        }

        function renderGrid() {
            const term = searchInput.value.toLowerCase();
            const filtered = products.filter(p => p.nombre.toLowerCase().includes(term));

            grid.innerHTML = filtered.map(p => {
                const stock = getCalculatedStock(p);
                return `
                <div onclick="addToCart({id: '${p.id}', nombre: '${p.nombre}', precio: ${p.precio}, stock: ${stock}})" 
                     class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 active:scale-95 transition-transform cursor-pointer hover:shadow-md h-32 flex flex-col justify-between ${stock <= 0 ? 'opacity-50 pointer-events-none grayscale' : ''}">
                    <div>
                        <div class="font-bold leading-tight line-clamp-2">${p.nombre}</div>
                        <div class="text-xs text-gray-400 uppercase mt-1">${p.categoria}</div>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="text-primary font-bold">LPS ${p.precio}</div>
                        <div class="text-[10px] ${stock <= 5 ? 'text-red-500 font-bold' : 'text-gray-400'} uppercase">
                            ${stock} en stock
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.addToCart = (product) => {
            const existing = cart.find(item => item.id === product.id);
            const currentQty = existing ? existing.qty : 0;

            if (currentQty + 1 > product.stock) {
                showAppAlert(`Solo hay ${product.stock} unidades disponibles.`);
                return;
            }

            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        };

        window.removeFromCart = (id) => {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        };

        window.updateQty = (id, delta) => {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) removeFromCart(id);
                else renderCart();
            }
        };

        function renderCart() {
            if (cart.length === 0) {
                cartList.innerHTML = '<div class="text-center text-gray-400 py-20">Carrito vacío</div>';
                totalEl.innerText = 'LPS 0.00';
                btnCheckout.disabled = true;
                return;
            }

            cartList.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100">
                    <div>
                        <div class="font-bold text-sm">${item.nombre}</div>
                        <div class="text-xs text-gray-400 font-mono">LPS ${(item.precio * item.qty).toFixed(2)}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQty('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center font-bold text-secondary hover:bg-gray-200">-</button>
                        <span class="font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center font-bold text-secondary hover:bg-gray-200">+</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((acc, item) => acc + (item.precio * item.qty), 0);
            totalEl.innerText = `LPS ${total.toFixed(2)}`;
            btnCheckout.disabled = false;
        }

        btnCheckout.onclick = async () => {
            const client = clientInput.value.trim();
            if (!client) {
                showAppAlert("Por favor ingresa el nombre del cliente.");
                return;
            }

            btnCheckout.disabled = true;
            btnCheckout.innerText = "PROCESANDO...";

            try {
                const itemsMap = {};
                cart.forEach(item => {
                    itemsMap[item.nombre] = item.qty;
                });

                const total = cart.reduce((acc, item) => acc + (item.precio * item.qty), 0);

                // Use transaction to handle stock deduction
                await runTransaction(db, async (transaction) => {
                    const tempDeductions = new Map(); // ID -> Amount to deduct
                    const docsToRead = new Set();

                    // 1. Identify initial docs to read (products in cart)
                    cart.forEach(item => docsToRead.add(item.id));

                    const docSnaps = new Map(); // ID -> Snapshot

                    // 2. Read all cart products
                    for (const id of docsToRead) {
                        const ref = doc(db, "productos", id);
                        const snap = await transaction.get(ref);
                        if (!snap.exists()) throw "Producto no encontrado: " + id;
                        docSnaps.set(id, snap);
                    }

                    // 3. Identify ingredients needed
                    const ingredientIds = new Set();
                    for (const item of cart) {
                        const snap = docSnaps.get(item.id);
                        const data = snap.data();
                        if (data.receta && data.receta.length > 0) {
                            data.receta.forEach(ing => {
                                if (!docSnaps.has(ing.id)) ingredientIds.add(ing.id);
                            });
                        }
                    }

                    // 4. Read ingredients
                    for (const id of ingredientIds) {
                        const ref = doc(db, "productos", id);
                        const snap = await transaction.get(ref);
                        if (!snap.exists()) throw "Ingrediente no encontrado: " + id;
                        docSnaps.set(id, snap);
                    }

                    // 5. Calculate deductions and validate stock (In Memory)
                    for (const item of cart) {
                        const snap = docSnaps.get(item.id);
                        const data = snap.data();

                        if (data.receta && data.receta.length > 0) {
                            // Recipe-based deduction
                            for (const ing of data.receta) {
                                const currentDeduction = tempDeductions.get(ing.id) || 0;
                                const addedDeduction = item.qty * ing.qty;
                                tempDeductions.set(ing.id, currentDeduction + addedDeduction);
                            }
                        } else {
                            // Direct deduction
                            const currentDeduction = tempDeductions.get(item.id) || 0;
                            tempDeductions.set(item.id, currentDeduction + item.qty);
                        }
                    }

                    // 6. Check for negative stock
                    for (const [id, deduction] of tempDeductions) {
                        const snap = docSnaps.get(id);
                        const currentStock = snap.data().cantidad;
                        if (currentStock < deduction) {
                            throw `Stock insuficiente de ${snap.data().nombre} (Hay ${currentStock}, necesitas ${deduction})`;
                        }
                    }

                    // 7. Writes
                    // Update stocks
                    for (const [id, deduction] of tempDeductions) {
                        const snap = docSnaps.get(id);
                        const newStock = snap.data().cantidad - deduction;
                        transaction.update(snap.ref, { cantidad: newStock });
                    }

                    // Create Order
                    const newOrderRef = doc(collection(db, "pedidos"));
                    transaction.set(newOrderRef, {
                        cliente: client,
                        comentario: document.getElementById('order-comment').value.trim(),
                        items: itemsMap,
                        total: total,
                        fecha: serverTimestamp(),
                        entregado: false,
                        pagado: false
                    });

                    return newOrderRef.id;
                });

                showAppAlert("¡Pedido realizado con éxito!");
                cart = [];
                clientInput.value = "";
                document.getElementById('order-comment').value = "";
                renderCart();
            } catch (error) {
                console.error("Error saving order:", error);
                showAppAlert("Error al guardar el pedido.");
            } finally {
                btnCheckout.disabled = false;
                btnCheckout.innerText = "COLOCAR PEDIDO";
            }
        };

        window.logout = () => {
            localStorage.removeItem('admin_session');
            window.location.href = 'index.html';
        };

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('sidebar-collapsed');
        };

        // --- Custom Alert Logic ---
        window.showAppAlert = (message, orderId = null) => {
            document.getElementById('alert-message').innerText = message;
            const qrContainer = document.getElementById('qrcode-container');
            const qrEl = document.getElementById('qrcode');

            if (orderId) {
                qrEl.innerHTML = "";
                new QRCode(qrEl, {
                    text: orderId,
                    width: 128,
                    height: 128,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                qrContainer.classList.remove('hidden');
            } else {
                qrContainer.classList.add('hidden');
            }

            const modal = document.getElementById('alert-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeAppAlert = () => {
            const modal = document.getElementById('alert-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };
    </script>
